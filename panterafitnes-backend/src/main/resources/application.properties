spring.application.name=panterfitness

spring.profiles.default=supabase
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=7200000
panterfitness.demo.enabled=${PANTERFITNESS_DEMO_ENABLED:false}

# Puerto: Render/Railway inyectan PORT; localmente 8080.
server.port=${PORT:8080}
# CORS solo para frontends en otro origen (desarrollo en :3000). Separar con comas.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
# Errores controlados: nunca exponer stack traces ni mensajes internos.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
# Compresion HTTP de HTML/JS/CSS/JSON servidos por Spring Boot.
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json
