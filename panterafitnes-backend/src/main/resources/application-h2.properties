spring.datasource.url=jdbc:h2:mem:panterfitnessdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# Consola H2 solo para desarrollo; el ejecutable y el hosting la desactivan con H2_CONSOLE_ENABLED=false.
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=create-drop
security.jwt.secret=${JWT_SECRET:${random.uuid}${random.uuid}}
panterfitness.demo.enabled=${PANTERFITNESS_DEMO_ENABLED:true}
