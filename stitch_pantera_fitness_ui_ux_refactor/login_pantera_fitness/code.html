<!DOCTYPE html>

<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login | Pantera Fitness</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Anybody:wght@700;800&family=Hanken+Grotesk:wght@400;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Anybody:wght@100..900&family=Hanken+Grotesk:wght@100..900&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-container": "#474746",
                        "on-tertiary": "#00344e",
                        "surface": "#131313",
                        "outline": "#a78b7d",
                        "inverse-primary": "#9c4500",
                        "on-secondary-fixed-variant": "#474746",
                        "background": "#070707",
                        "on-tertiary-fixed-variant": "#004c6e",
                        "on-secondary-fixed": "#1c1b1b",
                        "on-primary-fixed-variant": "#773300",
                        "on-surface-variant": "#e0c0b1",
                        "on-error-container": "#ffdad6",
                        "secondary": "#c8c6c5",
                        "on-tertiary-container": "#003b57",
                        "tertiary-container": "#00aaf2",
                        "error": "#ffb4ab",
                        "inverse-surface": "#e5e2e1",
                        "error-container": "#93000a",
                        "on-secondary-container": "#b7b4b4",
                        "surface-container-lowest": "#0e0e0e",
                        "surface-container": "#201f1f",
                        "primary": "#ffb68e",
                        "tertiary": "#8aceff",
                        "on-secondary": "#313030",
                        "on-error": "#690005",
                        "on-primary-fixed": "#331200",
                        "surface-variant": "#353534",
                        "primary-container": "#ff7a1a",
                        "inverse-on-surface": "#313030",
                        "secondary-fixed": "#e5e2e1",
                        "tertiary-fixed": "#c9e6ff",
                        "on-surface": "#e5e2e1",
                        "surface-tint": "#ffb68e",
                        "primary-fixed": "#ffdbca",
                        "on-primary": "#542200",
                        "primary-fixed-dim": "#ffb68e",
                        "tertiary-fixed-dim": "#8aceff",
                        "on-tertiary-fixed": "#001e2f",
                        "on-primary-container": "#5e2700",
                        "outline-variant": "#262626",
                        "surface-container-high": "#2a2a2a",
                        "on-background": "#e5e2e1",
                        "surface-container-highest": "#353534",
                        "surface-container-low": "#171717",
                        "surface-bright": "#3a3939",
                        "secondary-fixed-dim": "#c8c6c5",
                        "surface-dim": "#131313"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-desktop": "2.5rem",
                        "gutter": "1.5rem",
                        "metric-gap": "1rem",
                        "auth-card-width": "440px",
                        "container-max": "1200px",
                        "margin-mobile": "1rem"
                    },
                    "fontFamily": {
                        "display-lg-mobile": ["Anybody"],
                        "body-lg": ["Hanken Grotesk"],
                        "label-bold": ["Hanken Grotesk"],
                        "headline-md": ["Anybody"],
                        "display-lg": ["Anybody"],
                        "body-md": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "display-lg-mobile": ["36px", {"lineHeight": "1.1", "fontWeight": "800"}],
                        "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                        "label-bold": ["14px", {"lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "700"}],
                        "headline-md": ["24px", {"lineHeight": "1.2", "fontWeight": "700"}],
                        "display-lg": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                        "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #070707;
            font-family: 'Hanken Grotesk', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        .auth-card {
            background-color: #171717;
            transition: transform 0.3s ease;
        }
        input:focus {
            outline: none;
            border-color: #ff7a1a !important;
            box-shadow: 0 0 0 1px #ff7a1a;
        }
        .loading-state {
            display: none;
        }
        .is-loading .loading-state {
            display: inline-flex;
        }
        .is-loading .default-state {
            display: none;
        }
        @media (max-width: 768px) {
            .auth-card {
                width: 100vw;
                height: 100vh;
                border-radius: 0;
                border-top: none !important;
            }
        }
    </style>
</head>
<body class="dark flex items-center justify-center min-h-screen">
<!-- Subtle Background Atmosphere -->
<div class="fixed inset-0 pointer-events-none z-0">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary-container/10 blur-[120px] rounded-full"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-primary-container/5 blur-[120px] rounded-full"></div>
</div>
<!-- Login Container -->
<main class="relative z-10 w-full flex items-center justify-center">
<div class="auth-card w-full md:max-w-auth-card-width md:rounded-xl md:border-t-[3px] md:border-primary-container shadow-2xl flex flex-col p-8 md:p-10">
<!-- Brand Block -->
<header class="flex flex-col items-center text-center mb-10">
<div class="w-16 h-16 bg-primary-container rounded-full flex items-center justify-center mb-6 shadow-[0_0_20px_rgba(255,122,26,0.3)]">
<span class="font-headline-md text-headline-md text-on-primary-container">PF</span>
</div>
<h1 class="font-display-lg text-display-lg text-on-surface mb-2 tracking-tight">Pantera Fitness</h1>
<p class="font-body-md text-body-md text-on-surface-variant opacity-70">Entrená con propósito</p>
</header>
<!-- Login Form -->
<form class="flex flex-col gap-6" id="loginForm">
<div class="flex flex-col gap-2">
<label class="font-label-bold text-label-bold text-on-surface uppercase tracking-widest" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">mail</span>
<input class="w-full bg-[#070707] border border-outline-variant rounded-lg py-4 pl-12 pr-4 text-on-surface placeholder:text-surface-variant font-body-md transition-all" id="email" name="email" placeholder="ejemplo@pantera.fit" required="" type="email"/>
</div>
</div>
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<label class="font-label-bold text-label-bold text-on-surface uppercase tracking-widest" for="password">Contraseña</label>
<a class="text-[12px] font-label-bold text-primary-container hover:underline transition-all" href="#">¿Olvidaste?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">lock</span>
<input class="w-full bg-[#070707] border border-outline-variant rounded-lg py-4 pl-12 pr-4 text-on-surface placeholder:text-surface-variant font-body-md transition-all" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Submit Button -->
<button class="group relative w-full bg-primary-container hover:bg-[#ff8a33] active:scale-[0.98] text-on-primary-container font-label-bold text-label-bold uppercase py-5 rounded-lg mt-4 transition-all flex items-center justify-center gap-3 overflow-hidden" id="submitBtn" type="submit">
<span class="default-state flex items-center gap-2">
                        Iniciar sesión
                        <span class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</span>
<span class="loading-state flex items-center gap-3">
<svg class="animate-spin h-5 w-5 text-on-primary-container" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
<path class="opacity-75" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" fill="currentColor"></path>
</svg>
                        Ingresando...
                    </span>
</button>
</form>
<!-- Demo Access Section -->
<section class="mt-10 pt-8 border-t border-outline-variant">
<p class="text-center font-label-bold text-label-bold text-on-surface-variant uppercase tracking-[0.2em] mb-6">Acceso rápido demo</p>
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-2 py-3 px-4 border border-outline-variant hover:bg-surface-container-highest rounded-lg transition-all text-on-surface font-body-md" onclick="quickLogin('Atleta')" type="button">
<span class="material-symbols-outlined text-[18px]">bolt</span>
                        Atleta
                    </button>
<button class="flex items-center justify-center gap-2 py-3 px-4 border border-outline-variant hover:bg-surface-container-highest rounded-lg transition-all text-on-surface font-body-md" onclick="quickLogin('Coach')" type="button">
<span class="material-symbols-outlined text-[18px]">sports</span>
                        Coach
                    </button>
</div>
</section>
<!-- Footer Meta -->
<footer class="mt-auto md:mt-10 pt-10 pb-4 text-center">
<p class="font-body-md text-on-surface-variant text-[14px]">
                    ¿No tienes cuenta? 
                    <a class="text-primary-container font-bold hover:underline" href="#">Registrate ahora</a>
</p>
</footer>
</div>
</main>
<script>
        const form = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            submitBtn.classList.add('is-loading');
            submitBtn.disabled = true;

            // Simulate loading state for 2 seconds
            setTimeout(() => {
                submitBtn.classList.remove('is-loading');
                submitBtn.disabled = false;
                alert('Iniciando sesión en Pantera Fitness...');
            }, 2000);
        });

        function quickLogin(role) {
            const emailInput = document.getElementById('email');
            const passInput = document.getElementById('password');
            
            if (role === 'Atleta') {
                emailInput.value = 'atleta@pantera.fit';
                passInput.value = 'demo1234';
            } else {
                emailInput.value = 'coach@pantera.fit';
                passInput.value = 'demo1234';
            }
            
            // Visual feedback
            emailInput.classList.add('border-primary-container');
            passInput.classList.add('border-primary-container');
            setTimeout(() => {
                emailInput.classList.remove('border-primary-container');
                passInput.classList.remove('border-primary-container');
            }, 1000);
        }
    </script>
</body></html>
