# Mantiene despierto el servicio gratuito de Render: el plan free
# "duerme" la app tras 15 minutos sin tráfico y la primera carga tarda ~1 minuto.
name: Keep alive (Render)

on:
  schedule:
    - cron: "*/10 * * * *"   # cada 10 minutos (GitHub puede demorarlo unos minutos)
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /api/health
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://pantera-fitness.onrender.com/api/health) || true
            echo "Intento $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          exit 1
